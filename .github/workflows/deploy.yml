# Deploys every push to main to nurture-demos.vercel.app.
# Secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are set on the repo.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # only main goes to production, also for manual runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 1 deploy at a time, never cancel one that is running
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if main has moved on
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then echo "could not read main" >&2; exit 1; fi
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"
          else echo "main is at $tip, this run is for $GITHUB_SHA, skipping"; fi
      - name: Deploy
        if: steps.tip.outputs.latest == 'true'
        run: npx --yes vercel@59 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
